services:
  backend:
    build:
      context: ./backend
    container_name: orderpulse-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: orderpulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
